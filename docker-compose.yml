services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: qa_allocation
      POSTGRES_USER: qa_allocation
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD (see .env.example)}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa_allocation -d qa_allocation"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://qa_allocation:${POSTGRES_PASSWORD}@db:5432/qa_allocation
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      CORS_ORIGINS: ""
    ports:
      - "8000:8000"

volumes:
  db-data:
